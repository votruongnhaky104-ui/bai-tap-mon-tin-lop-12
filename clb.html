
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lịch hoạt động câu lạc bộ</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #704456;
    padding: 25px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 18px #eac5d5;
}

h2 {
    text-align: center;
    color: #bd6087;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    overflow: hidden;
    border-radius: 10px;
}

caption {
    font-size: 20px;
    font-weight: bold;
    color: #bd6087;
    padding: 15px;
}

th {
    background: #d77a9f;
    color: white;
    padding: 12px;
    border: 1px solid #e8a9c1;
}

td {
    padding: 12px;
    border: 1px solid #efcada;
}

tr:nth-child(even) td {
    background: #fff0f5;
}

tr:nth-child(odd) td {
    background: #fffafd;
}

.highlight {
    color: #c34e80;
    font-weight: bold;
}

</style>
</head>

<body>
<div class="container">

<h2>🌷 LỊCH SINH HOẠT CÂU LẠC BỘ 🌷</h2>

<table>
<caption>Lịch hoạt động CLB Thể thao</caption>

<tr>
    <th rowspan="2">Bộ môn</th>
    <th rowspan="2">GV phụ trách</th>
    <th colspan="5">Ngày</th>
</tr>

<tr>
    <th>Thứ 2</th>
    <th>Thứ 3</th>
    <th>Thứ 4</th>
    <th>Thứ 5</th>
    <th>Thứ 6</th>
</tr>

<tr>
    <td>Bóng đá</td>
    <td>Thầy Khải</td>
    <td></td>
    <td class="highlight">X</td>
    <td></td>
    <td></td>
    <td class="highlight">X</td>
</tr>

<tr>
    <td>Bóng chuyền</td>
    <td>Cô Lan</td>
    <td class="highlight">X</td>
    <td></td>
    <td></td>
    <td></td>
    <td></td>
</tr>

<tr>
    <td>Bóng rổ</td>
    <td>Thầy Võ</td>
    <td></td>
    <td></td>
    <td class="highlight">X</td>
    <td></td>
    <td></td>
</tr>

<tr>
    <td>Võ thuật</td>
    <td>
        Thầy Hoàng - Karatedo<br>
        Thầy Đức - Taekwondo<br>
        Thầy Thắng - Vovinam
    </td>
    <td class="highlight">X</td>
    <td class="highlight">X</td>
    <td></td>
    <td class="highlight">X</td>
    <td></td>
</tr>

<tr>
    <td>Bơi</td>
    <td>Cô Diễm</td>
    <td></td>
    <td></td>
    <td class="highlight">X</td>
    <td></td>
    <td class="highlight">X</td>
</tr>

</table>
</div>
</body>
</html>
